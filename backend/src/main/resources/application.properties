server.port=8080

# -----------------------------------------------------------------------------
# SEGURIDAD E IDENTIDAD (Azure AD - IDaaS)
# -----------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/d4e45c2c-5598-4953-9517-f1c5f09d4eb1/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=c515cc67-aed4-4210-89f0-433271797592

# -----------------------------------------------------------------------------
# BASE DE DATOS LOCAL (H2)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2 para depuración web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# CONFIGURACIÓN RABBITMQ
# -----------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Definición de Colas, Exchanges y Keys
app.rabbitmq.queue=shipment.status.queue
app.rabbitmq.exchange=shipment.exchange
app.rabbitmq.routingkey=shipment.status.key
app.rabbitmq.routingkey.notify=shipment.status.key

# -----------------------------------------------------------------------------
# CONFIGURACIÓN KAFKA
# -----------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topic.shipments-events=shipments.events